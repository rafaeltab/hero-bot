name: Mutations
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  mutation-advisory:
    name: Advisory (${{ matrix.shard }}/8)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    continue-on-error: true
    runs-on: ubuntu-24.04
    # Full build/test fallback is required for subprocess mutation coverage.
    # The notification-only slice contains 2,807 mutants (440 in the largest
    # eight-way shard), so a 20-minute job budget cannot complete the analysis.
    timeout-minutes: 240
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: hero_test
          POSTGRES_PASSWORD: hero_test
          POSTGRES_DB: hero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hero_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HERO_TEST_DATABASE_URL: postgresql://hero_test:hero_test@127.0.0.1:5432/hero_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm mutation:verify
      - name: Analyze added/replaced production lines
        env:
          MUTATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm mutation --base "$MUTATION_BASE" --shard "${{ matrix.shard }}/8"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: |
            apps/discord-bot/reports/mutation/
            reports/mutation-fixtures/
          if-no-files-found: warn
  summary:
    name: Results
    if: always()
    needs: mutation-advisory
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mutation-shard-*
          path: mutation-results
      - if: always()
        run: node scripts/mutation/summary.mjs mutation-results 8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutation-summary
          path: mutation-summary.json
          if-no-files-found: warn
