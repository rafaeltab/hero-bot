name: Mutations
on:
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mutations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  mutation-advisory:
    name: Advisory
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: hero_test
          POSTGRES_PASSWORD: hero_test
          POSTGRES_DB: hero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hero_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HERO_TEST_DATABASE_URL: postgresql://hero_test:hero_test@127.0.0.1:5432/hero_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - run: pnpm install --frozen-lockfile
      - name: Plan production scope
        id: plan
        env:
          MUTATION_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          MUTATION_SCOPE: ${{ github.event_name == 'pull_request' && 'changed' || 'all' }}
        run: |
          pnpm --silent mutation --base "$MUTATION_BASE" --scope "$MUTATION_SCOPE" --plan > /tmp/mutation-plan.json
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("/tmp/mutation-plan.json")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `selected=${p.mutate.length > 0}\n`);'
      - name: Restore compatible PR or default-branch checkpoints
        if: steps.plan.outputs.selected == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/discord-bot/reports/mutation/checkpoint-*.json
          key: hero-mutation-v2-${{ runner.os }}-${{ github.event.pull_request.number || 'main' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hero-mutation-v2-${{ runner.os }}-${{ github.event.pull_request.number || 'main' }}-
            hero-mutation-v2-${{ runner.os }}-main-
      # Contract checks do not execute mutants. Ordinary CI retains all process tests.
      - run: pnpm mutation:verify
      - name: Verify native mutation execution and checkpoint compatibility
        run: pnpm mutation:verify:real
      - name: Analyze with coverage-guided unit and integration stages
        env:
          MUTATION_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          MUTATION_SCOPE: ${{ github.event_name == 'pull_request' && 'changed' || 'all' }}
          MUTATION_BUDGET: ${{ github.event_name == 'pull_request' && '900' || '3600' }}
        run: pnpm mutation --base "$MUTATION_BASE" --scope "$MUTATION_SCOPE" --budget "$MUTATION_BUDGET"
      # PR checkpoints are confined to their merge ref and PR-number namespace.
      - name: Save checkpoint continuation
        if: success() && steps.plan.outputs.selected == 'true' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/discord-bot/reports/mutation/checkpoint-*.json
          key: hero-mutation-v2-${{ runner.os }}-${{ github.event.pull_request.number || 'main' }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutation-results
          path: apps/discord-bot/reports/mutation/
          if-no-files-found: warn
