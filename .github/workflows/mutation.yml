name: Advisory mutation analysis
on:
  pull_request:
  push:
    branches: [main, t3/scaffold-foundation-integration]
permissions:
  contents: read
jobs:
  mutation-advisory:
    name: Advisory changed-code mutations (not a merge gate)
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm mutation:verify
      - name: Analyze added/replaced production lines
        env:
          MUTATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm mutation --base "$MUTATION_BASE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: advisory-mutation-results
          path: |
            apps/discord-bot/reports/mutation/
            reports/mutation-fixtures/
          if-no-files-found: warn
